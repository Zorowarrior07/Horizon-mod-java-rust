name: probe-api
on:
  workflow_dispatch:
  push:
    paths: ['tools/probes/**', '.github/workflows/probe-api.yml']
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.9.1' }
      - name: Find the merged jar and dump the API
        continue-on-error: true
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-25-jdk-amd64
        run: |
          mkdir -p ci
          cat > /tmp/cp.gradle <<'EOF'
          allprojects {
              tasks.register('printCp') { doLast {
                  configurations.compileClasspath.files.each { println "CP " + it } } }
          }
          EOF
          ( cd java/fabric && gradle --no-daemon -q -I /tmp/cp.gradle printCp \
              -Pmc_version=1.21.4 -Pyarn_mappings=1.21.4+build.8 -Pjava_target=21 ) > /tmp/cp.txt 2>&1 || true
          mcj=$(grep -oE 'CP .*minecraft-merged-1.21.4[^ ]*\.jar' /tmp/cp.txt | sed 's/^CP //' | head -1)
          echo "merged jar: $mcj" > ci/blocksettings.txt
          bash tools/probes/blocksettings.sh "$PWD/ci/blocksettings.txt" "$mcj" || true
          bash tools/probes/fabricapi.sh "$PWD/ci/fabricapi.txt" "$mcj" || true
          cat ci/fabricapi.txt > /dev/null
          JAVA_HOME=/usr/lib/jvm/temurin-25-jdk-amd64 \
            bash tools/probes/moddevrun.sh "$PWD/ci/moddevrun.txt" || true
          echo "===== toml in classes dir" >> ci/moddevrun.txt
          cat java/neoforge26/build/classes/java/main/META-INF/neoforge.mods.toml >> ci/moddevrun.txt 2>&1
          echo "===== toml in resources dir" >> ci/moddevrun.txt
          cat java/neoforge26/build/resources/main/META-INF/neoforge.mods.toml >> ci/moddevrun.txt 2>&1
          echo "===== grep license (both)" >> ci/moddevrun.txt
          grep -rn 'license' java/neoforge26/build/classes/java/main/META-INF/ java/neoforge26/build/resources/main/META-INF/ >> ci/moddevrun.txt 2>&1
          echo "===== source toml" >> ci/moddevrun.txt
          cat java/neoforge26/src/main/resources/META-INF/neoforge.mods.toml >> ci/moddevrun.txt 2>&1
          echo "===== serverRunVmArgs" >> ci/moddevrun.txt
          cat java/neoforge26/build/moddev/serverRunVmArgs.txt >> ci/moddevrun.txt 2>&1
          echo >> ci/moddevrun.txt
          echo "===== serverRunProgramArgs" >> ci/moddevrun.txt
          cat java/neoforge26/build/moddev/serverRunProgramArgs.txt >> ci/moddevrun.txt 2>&1
          JAVA_HOME=/usr/lib/jvm/temurin-25-jdk-amd64 \
            bash tools/probes/block26.sh "$PWD/ci/block26.txt" || true
          JAVA_HOME=/usr/lib/jvm/temurin-25-jdk-amd64 \
            bash tools/probes/deferred26.sh "$PWD/ci/deferred26.txt" || true
          cat ci/deferred26.txt
      - name: Commit
        if: always()
        run: |
          bash tools/ci-commit.sh "ci: block settings api probe $(date -u +%FT%TZ)" ci
