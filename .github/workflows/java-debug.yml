name: java-debug

# Throwaway diagnostic: print the exact signatures of every game method this
# mod calls, for each target version, so the source is written against real
# APIs rather than remembered ones.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/java-debug.yml']

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.9.1' }

      - name: Collect diagnostics
        run: |
          mkdir -p ci
          cat > /tmp/cp.gradle <<'EOF'
          allprojects {
              tasks.register('printCp') {
                  doLast {
                      configurations.compileClasspath.files.each { println "CP " + it }
                  }
              }
          }
          EOF
          {
            for t in "1.21.1 1.21.1+build.3" "1.21.11 1.21.11+build.6"; do
              set -- $t
              echo "########## $1"
              ( cd java/fabric && gradle --no-daemon -q -I /tmp/cp.gradle printCp \
                  -Pmc_version=$1 -Pyarn_mappings=$2 -Pjava_target=21 2>&1 ) > /tmp/ctx.txt
              mcjar=$(grep -E 'CP .*minecraft-merged' /tmp/ctx.txt | sed 's/^CP //' | head -1)
              echo "MCJAR=$mcjar"
              echo "--- AbstractBlock.Settings (static create / builder methods)"
              javap -cp "$mcjar" net.minecraft.block.AbstractBlock\$Settings 2>&1 | grep -E 'static|strength|luminance|sounds|requiresTool' | head -12
              echo "--- Registry.register"
              javap -cp "$mcjar" net.minecraft.registry.Registry 2>&1 | grep -E 'register' | head -6
              echo "--- Identifier.of"
              javap -cp "$mcjar" net.minecraft.util.Identifier 2>&1 | grep -E 'of|ofVanilla' | head -8
              echo "--- Item.Settings constructor"
              javap -cp "$mcjar" net.minecraft.item.Item\$Settings 2>&1 | head -6
              echo "--- BlockItem ctor"
              javap -cp "$mcjar" net.minecraft.item.BlockItem 2>&1 | grep -E 'BlockItem\(' | head -4
              echo "--- Block ctor"
              javap -cp "$mcjar" net.minecraft.block.Block 2>&1 | grep -E 'Block\(' | head -4
              echo "--- FabricLoader.getModContainer"
              ls ~/.gradle/caches/modules-2/files-2.1/net.fabricmc/fabric-loader/*/*/*/fabric-loader-*.jar 2>/dev/null | head -1
            done
          } > ci/debug.log 2>&1
          wc -l ci/debug.log

      - name: Commit diagnostics
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          git add -f ci/debug.log
          git commit -m "ci: api signature probe $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push
