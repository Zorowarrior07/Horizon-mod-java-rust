name: java-debug

# Throwaway diagnostic: does Loom resolve Minecraft when Gradle itself runs on
# JDK 25 (the JVM loom 1.19.4 requires) while the toolchain still targets 21?
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/java-debug.yml']

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.9.1' }

      - name: Collect diagnostics
        run: |
          set -x
          mkdir -p ci
          ls /usr/lib/jvm
          cat > /tmp/cp.gradle <<'EOF'
          allprojects {
              tasks.register('printCp') {
                  doLast {
                      println "BUILD_JDK=" + System.getProperty('java.version')
                      configurations.compileClasspath.files.each { println "CP " + it }
                  }
              }
          }
          EOF
          {
            echo "===== JDK 25 present?"
            ls -d /usr/lib/jvm/*25* || true
            echo
            echo "===== compile with JAVA_HOME=JDK25"
            ( cd java/fabric && JAVA_HOME=$(ls -d /usr/lib/jvm/*25* | head -1) \
                gradle --no-daemon build -Pmc_version=1.21.1 -Pyarn_mappings=1.21.1+build.3 \
                -Ploader_version=0.20.1 -Pjava_target=21 2>&1 ) | tail -45
            echo
            echo "===== compileClasspath contents"
            ( cd java/fabric && JAVA_HOME=$(ls -d /usr/lib/jvm/*25* | head -1) \
                gradle --no-daemon -q -I /tmp/cp.gradle printCp 2>&1 ) | head -30
            echo
            echo "===== produced files"
            ls -la java/fabric/build/libs java/fabric/build/bridge-build-facts.json 2>&1
          } > ci/debug.log 2>&1
          tail -50 ci/debug.log

      - name: Commit diagnostics
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          git add -f ci/debug.log
          git commit -m "ci: java debug $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
