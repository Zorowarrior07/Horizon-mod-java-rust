name: java-debug

# Throwaway diagnostic: dump the real Yarn names available in each target's
# Minecraft jar, and the Yarn names used for the ~15 classes this mod needs.
# The point is to stop guessing at API names and read them off the artifact.
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/java-debug.yml']

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.9.1' }

      - name: Collect diagnostics
        run: |
          mkdir -p ci
          cat > /tmp/cp.gradle <<'EOF'
          allprojects {
              tasks.register('printCp') {
                  doLast {
                      println "BUILD_JDK=" + System.getProperty('java.version')
                      configurations.compileClasspath.files.each { println "CP " + it }
                  }
              }
          }
          EOF
          {
            for t in "1.21.1 1.21.1+build.3" "1.21.4 1.21.4+build.8" "1.21.11 1.21.11+build.6"; do
              set -- $t
              echo "########## $1"
              ( cd java/fabric && JAVA_HOME=/usr/lib/jvm/temurin-25-jdk-amd64 \
                  gradle --no-daemon -q -I /tmp/cp.gradle printCp \
                  -Pmc_version=$1 -Pyarn_mappings=$2 -Pjava_target=21 2>&1 ) > /tmp/ctx.txt
              head -3 /tmp/ctx.txt
              mcjar=$(grep 'CP .*minecraft-.*-yarn' /tmp/ctx.txt | sed 's/^CP //' | head -1)
              echo "MCJAR=$mcjar"
              if [ -n "$mcjar" ]; then
                unzip -l "$mcjar" | grep -c '\.class' || true
                for c in block/AbstractBlock block/Block block/Blocks item/Item item/BlockItem \
                         registry/Registries registry/Registry util/Identifier \
                         sound/BlockSoundGroup; do
                  unzip -l "$mcjar" "net/minecraft/$c.class" 2>/dev/null | grep -q "$c.class" \
                    && echo "  HAS net/minecraft/$c" || echo "  MISSING net/minecraft/$c"
                done
                # what BlockSoundGroup constants exist
                unzip -p "$mcjar" net/minecraft/sound/BlockSoundGroup.class > /tmp/bsg.class 2>/dev/null \
                  && javap -cp "$mcjar" net.minecraft.sound.BlockSoundGroup 2>&1 | head -30
              fi
            done

            echo
            echo "########## yarn mappings: real names for our classes"
            yarn=$(ls ~/.gradle/caches/modules-2/files-2.1/net.fabricmc/yarn/*/*/*/yarn-*-mergedv2.jar 2>/dev/null | head -1)
            echo "yarn jar=$yarn"
            ls ~/.gradle/caches/modules-2/files-2.1/net.fabricmc/yarn/*/*/*/ 2>/dev/null | head
          } > ci/debug.log 2>&1
          wc -l ci/debug.log

      - name: Commit diagnostics
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          git add -f ci/debug.log
          git commit -m "ci: java debug $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
          git push
