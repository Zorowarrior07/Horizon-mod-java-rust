name: rfg-probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/rfg-probe.yml']
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Probe
        run: |
          mkdir -p ci /tmp/rfg
          {
            echo "== mcpbot (expected dead)"; curl -s -o /dev/null -w '%{http_code}\n' --max-time 15 https://export.mcpbot.bspk.rs/versions.json
            echo "== mcp_stable 22-1.8.9 zip"; curl -s -o /dev/null -w '%{http_code}\n' --max-time 20 https://maven.minecraftforge.net/de/oceanlabs/mcp/mcp_stable/22-1.8.9/mcp_stable-22-1.8.9.zip
            echo "== retrofuturagradle metadata"; curl -s --max-time 25 https://maven.gtnewhorizons.com/releases/com/gtnewhorizons/retrofuturagradle/maven-metadata.xml | tail -25
          } > ci/rfg-probe.txt 2>&1
          cat ci/rfg-probe.txt
      - name: Try RetroFuturaGradle on 1.8.9
        continue-on-error: true
        run: |
          cd /tmp/rfg
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  maven { url = 'https://maven.gtnewhorizons.com/releases' }
                  maven { url = 'https://maven.minecraftforge.net/' }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = 'rfgtest'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
              id 'java'
          }
          minecraft {
              mcVersion = '1.8.9'
              mcpMappingChannel = 'stable'
              mcpMappingVersion = '22'
              username = 'Developer'
          }
          tasks.register('showTasks') { doLast { println "RFG CONFIGURED OK" } }
          EOF
          gradle --no-daemon showTasks --stacktrace >> /home/runner/work/Horizon-mod-java-rust/Horizon-mod-java-rust/ci/rfg-probe.txt 2>&1 || true
          tail -25 /home/runner/work/Horizon-mod-java-rust/Horizon-mod-java-rust/ci/rfg-probe.txt
      - name: Commit
        if: always()
        run: |
          bash tools/ci-commit.sh "ci: rfg probe $(date -u +%FT%TZ)" ci
