name: rfg-probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/rfg-probe.yml', 'tools/probes/**']
permissions: { contents: write }
jobs:
  twenty-six:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.9.1' }
      - name: Probe 26.x
        continue-on-error: true
        run: |
          mkdir -p ci
          python3 tools/probes/versions.py > ci/probe26.txt 2>&1 || true
          JAVA_HOME=/usr/lib/jvm/temurin-25-jdk-amd64 \
            bash tools/probes/loom26.sh "$PWD/ci/probe26-build.txt" || true
          tail -25 ci/probe26-build.txt
      - name: Commit
        if: always()
        run: |
          run: bash tools/ci-commit.sh "ci: probe 26.x $(date -u +%FT%TZ)" ci
  fg21:
    needs: twenty-six
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Probe ForgeGradle 2.1.2 data sources
        continue-on-error: true
        run: |
          mkdir -p ci
          bash tools/probes/fg21.sh "$PWD/ci/fg21.txt" || true
          cat ci/fg21.txt
      - name: Commit
        if: always()
        run: |
          run: bash tools/ci-commit.sh "ci: probe fg21 $(date -u +%FT%TZ)" ci
