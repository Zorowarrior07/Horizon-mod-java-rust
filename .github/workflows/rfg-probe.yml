name: rfg-probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/rfg-probe.yml', 'tools/probes/**']
permissions: { contents: write }
concurrency:
  group: probes
  cancel-in-progress: false
jobs:
  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.9.1' }
      - name: Probe everything
        continue-on-error: true
        env:
          REPO_JAVA: ${{ github.workspace }}/java
          REPO_ROOT: ${{ github.workspace }}
          ARTIFACT_DIR: ${{ github.workspace }}/artifacts/java-1.8.9
        run: |
          mkdir -p ci artifacts/java-1.8.9
          python3 tools/probes/versions.py > ci/probe26.txt 2>&1 || true
          python3 tools/probes/official26.py > ci/official26.txt 2>&1 || true
          bash tools/probes/loomver.sh > ci/loomver.txt 2>&1 || true
          JAVA_HOME=/usr/lib/jvm/temurin-25-jdk-amd64 \
            bash tools/probes/loom26.sh "$PWD/ci/probe26-build.txt" || true
          bash tools/probes/forge189.sh "$PWD/ci/forge189-probe.txt" || true
          bash tools/probes/fgstrings.sh "$PWD/ci/fgstrings.txt" || true
          bash tools/probes/moddev.sh "$PWD/ci/moddev.txt" || true
          JAVA_HOME=/usr/lib/jvm/temurin-25-jdk-amd64 \
            bash tools/probes/neo26.sh "$PWD/ci/neo26.txt" || true

          bash tools/probes/forge189-build.sh "$PWD/ci/forge189-build.txt" || true
          tail -4 ci/probe26.txt; tail -6 ci/probe26-build.txt
          echo ---; cat ci/forge189-probe.txt
          echo ---; tail -12 ci/forge189-build.txt
          echo ---; tail -8 ci/neo26.txt
      - name: Commit
        if: always()
        run: |
          bash tools/ci-commit.sh "ci: consolidated probe $(date -u +%FT%TZ)" ci artifacts
