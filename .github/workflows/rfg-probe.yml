name: rfg-probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/rfg-probe.yml']
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: RFG 2.0.6 configure test
        continue-on-error: true
        run: |
          set -x
          mkdir -p /tmp/rfg && cd /tmp/rfg
          echo "rootProject.name='rfgtest'" > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  maven { url = 'https://nexus.gtnewhorizons.com/repository/releases' }
                  maven { url = 'https://maven.minecraftforge.net/' }
                  mavenCentral()
              }
              dependencies { classpath 'com.gtnewhorizons:retrofuturagradle:2.0.6' }
          }
          apply plugin: 'com.gtnewhorizons.retrofuturagradle'
          apply plugin: 'java'
          minecraft {
              mcVersion = '1.8.9'
              mcpMappingChannel = 'stable'
              mcpMappingVersion = '22'
          }
          tasks.register('showOk') { doLast { println 'RFG CONFIGURED OK' } }
          EOF
          gradle --no-daemon showOk --stacktrace 2>&1 | tail -40
