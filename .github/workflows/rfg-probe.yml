name: rfg-probe
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/rfg-probe.yml']
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '25' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.9.1' }
      - name: RFG 2.0.6 with JDK 25, compile real 1.8.9 mod
        continue-on-error: true
        run: |
          set -x
          REPO=$PWD
          mkdir -p /tmp/rfg/src/main/java/example && cd /tmp/rfg
          echo "rootProject.name='rfgtest'" > settings.gradle
          cat > build.gradle <<'EOF'
          buildscript {
              repositories {
                  maven { url = 'https://nexus.gtnewhorizons.com/repository/releases' }
                  maven { url = 'https://maven.minecraftforge.net/' }
                  mavenCentral()
              }
              dependencies { classpath 'com.gtnewhorizons:retrofuturagradle:2.0.6' }
          }
          apply plugin: 'com.gtnewhorizons.retrofuturagradle'
          apply plugin: 'java'
          minecraft { mcVersion = '1.8.9' }
          tasks.withType(JavaCompile).configureEach { options.release = 8 }
          tasks.register('showOk') { doLast { println 'RFG CONFIGURED OK' } }
          EOF
          cat > src/main/java/example/T.java <<'EOF'
          package example;
          import net.minecraft.block.Block;
          import net.minecraft.init.Blocks;
          public class T {
              public static Block b = Blocks.stone;
              public static void main(String[] a) { System.out.println(b); }
          }
          EOF
          JAVA_HOME=/usr/lib/jvm/temurin-25-jdk-amd64 gradle --no-daemon compileJava \
            --stacktrace 2>&1 | tee "$REPO/ci/rfg-probe.txt" | tail -25
      - name: Commit
        if: always()
        run: |
          bash tools/ci-commit.sh "ci: rfg compile test $(date -u +%FT%TZ)" ci
