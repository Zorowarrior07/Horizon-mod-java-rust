name: probe
on: [push, workflow_dispatch]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchains
        run: |
          java -version
          javac -version
          echo "---"
          ls /usr/lib/jvm || true
      - name: Rust
        run: cargo --version
