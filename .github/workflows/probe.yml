name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: |
          exec > ci/probe2.txt 2>&1
          echo "== fabric-loom versions"
          curl -sS https://maven.fabricmc.net/net/fabricmc/fabric-loom/maven-metadata.xml | grep -o '<version>[^<]*' | tail -12
          echo "== gradle current"
          curl -sS https://services.gradle.org/versions/current | head -5
          echo "== fabric loader for 1.21.4/1.21.11/26.3"
          for v in 1.21.4 1.21.11 26.1 26.2 26.3; do
            echo -n "$v loader: "; curl -sS https://meta.fabricmc.net/v2/versions/loader/$v | head -c 200; echo
            echo -n "$v yarn: "; curl -sS https://meta.fabricmc.net/v2/versions/yarn/$v | head -c 200; echo
          done
          echo "== fabric-api versions (1.21.4, 1.21.11, 26.x)"
          curl -sS "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%221.21.4%22%5D" | head -c 400; echo
          echo "== neoform/neoforge for 26.x"
          curl -sS https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -o '<version>26[^<]*' | tail -6
          echo "== forge 1.8.9 versions"
          curl -sS https://maven.minecraftforge.net/net/minecraftforge/forge/maven-metadata.xml | grep -o '<version>1.8.9[^<]*' | tail -4
      - name: Commit
        if: always()
        run: |
          git config user.name ci
          git config user.email ci@example.invalid
          git add -A ci && git commit -m "ci: probe2" || true
          git push || true
