name: probe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains
        run: |
          java -version 2>&1 | tee ci/java.txt
          javac -version 2>&1 | tee -a ci/java.txt
          ls /usr/lib/jvm >> ci/java.txt 2>&1 || true
          cargo --version >> ci/java.txt
      - name: Commit the report back
        run: |
          git config user.name "ci"
          git config user.email "ci@example.invalid"
          git add ci/java.txt
          git commit -m "ci: toolchain report" || true
          git push
