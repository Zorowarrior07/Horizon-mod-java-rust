name: java-mod-jars
on:
  push:
    paths:
      - 'java/**'
      - '.github/workflows/java.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fabric:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: '1.21.1', java: 21, yarn: '1.21.1+build.3', loader: '0.16.9', api: '0.107.0+1.21.1' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build
        run: |
          mkdir -p ci
          set +e
          cd java/fabric
          gradle --no-daemon --stacktrace build \
            -Pmc_version=${{ matrix.mc }} -Pyarn_mappings="${{ matrix.yarn }}" \
            -Ploader_version=${{ matrix.loader }} -Pfabric_version=${{ matrix.api }} \
            -Pjava_target=${{ matrix.java }} > ../../ci/fabric-${{ matrix.mc }}.log 2>&1
          echo "exit=$?" >> ../../ci/fabric-${{ matrix.mc }}.log
          ls -la build/libs >> ../../ci/fabric-${{ matrix.mc }}.log 2>&1
          echo "--- tail ---"
          tail -40 ../../ci/fabric-${{ matrix.mc }}.log
      - name: Commit the log
        if: always()
        run: |
          git config user.name ci
          git config user.email ci@example.invalid
          git add -A ci
          git commit -m "ci: fabric ${{ matrix.mc }} build log" || true
          git push || true
