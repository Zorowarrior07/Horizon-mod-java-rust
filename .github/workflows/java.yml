name: java-mod-jars

# Builds one real, installable Java Edition mod jar per target Minecraft version.
#
# Targets are independent: 1.8.9 needs ForgeGradle 2.3 on Gradle 4.10.3 + JDK 8,
# 1.21.x needs Loom or ModDevGradle on modern Gradle, and 26.x needs Java 25 and
# Mojang official mappings (no Yarn exists for it). Each is a separate job with
# its own toolchain, because the toolchains genuinely cannot be shared.
#
# Results are committed back into the repo: `artifacts/` holds the jars,
# `ci/logs/` holds the build logs and verifier verdicts. Jobs run serially
# (`max-parallel: 1`) and push through tools/ci-commit.sh, which retries with a
# rebase, so one job cannot clobber another's commit.

on:
  push:
    paths: ['java/**', 'tools/**', '.github/workflows/java.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: java-mod-jars-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.9.1' }
      - name: Build every Fabric 1.21.x target
        env:
          # fabric-loom 1.19.4 refuses to configure on a JVM older than 25.
          # Gradle runs on 25; the compiler targets 21 via the Gradle toolchain.
          JAVA_HOME: /usr/lib/jvm/temurin-25-jdk-amd64
        run: |
          mkdir -p ci/logs artifacts/java-1.21.x
          status=0
          while read -r mc yarn javav; do
            [ -z "$mc" ] && continue
            echo "::group::Fabric $mc"
            ( cd java/fabric && gradle --no-daemon build \
                -Pmc_version="$mc" -Pyarn_mappings="$yarn" \
                -Ploader_version=0.20.1 -Pjava_target="$javav" ) \
                > "ci/logs/fabric-$mc.log" 2>&1 || status=1
            grep -nE "checkSources|Task :compileJava|error:|FAILURE|What went wrong" \
                "ci/logs/fabric-$mc.log" | head -20 || true
            for jar in java/fabric/build/libs/*.jar; do
              [ -e "$jar" ] || continue
              cp "$jar" artifacts/java-1.21.x/
            done
            cp java/fabric/build/bridge-build-facts.json "ci/logs/fabric-$mc.facts.json" 2>/dev/null || true
            echo "::endgroup::"
          done <<'TARGETS'
          1.21.1  1.21.1+build.3   21
          1.21.4  1.21.4+build.8   21
          1.21.11 1.21.11+build.6  21
          TARGETS
          ls -la artifacts/java-1.21.x
          exit $status
      - name: Verify
        if: always()
        run: |
          shopt -s nullglob
          jars=(artifacts/java-1.21.x/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "no jars were produced" | tee artifacts/java-1.21.x/VERIFY.txt; exit 0
          fi
          python3 tools/verify_jar.py "${jars[@]}" \
            --json artifacts/java-1.21.x/verify.json \
            | tee artifacts/java-1.21.x/VERIFY.txt
      - name: Commit
        if: always()
        run: bash tools/ci-commit.sh "ci: fabric jars $(date -u +%FT%TZ)" ci artifacts

  neoforge:
    needs: fabric
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Build NeoForge 1.21.1
        continue-on-error: true
        run: |
          mkdir -p ci/logs artifacts/java-1.21.x
          ( cd java/neoforge && gradle --no-daemon build \
              -Pmc_version=1.21.1 -Pneo_version=21.1.266 -Pjava_target=21 ) \
              > ci/logs/neoforge-1.21.1.log 2>&1 || true
          grep -nE "error:|FAILURE|What went wrong|Caused by:|Task :compileJava|checkSources" \
              ci/logs/neoforge-1.21.1.log | head -25 || true
          cp java/neoforge/build/libs/*.jar artifacts/java-1.21.x/ 2>/dev/null || true
          cp java/neoforge/build/bridge-build-facts.json ci/logs/neoforge-1.21.1.facts.json 2>/dev/null || true
          ls -la artifacts/java-1.21.x
      - name: Verify
        if: always()
        run: |
          python3 tools/verify_jar.py artifacts/java-1.21.x/*neoforge*.jar \
            --json artifacts/java-1.21.x/verify-neoforge.json \
            > artifacts/java-1.21.x/VERIFY-neoforge.txt 2>&1 || true
          cat artifacts/java-1.21.x/VERIFY-neoforge.txt
      - name: Commit
        if: always()
        run: bash tools/ci-commit.sh "ci: neoforge jar $(date -u +%FT%TZ)" ci artifacts

  forge189:
    needs: neoforge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8' }
      - name: Install Gradle 4.10.3
        # ForgeGradle 2.3 does not run on Gradle 5+, so this job brings its own.
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-4.10.3-bin.zip
          unzip -q /tmp/gradle.zip -d /opt
          /opt/gradle-4.10.3/bin/gradle --version
      - name: Build Forge 1.8.9
        continue-on-error: true
        run: |
          mkdir -p ci/logs artifacts/java-1.8.9
          ( cd java/forge189 && /opt/gradle-4.10.3/bin/gradle --no-daemon build --stacktrace ) \
            > ci/logs/forge-1.8.9.log 2>&1 || true
          grep -nE "error:|FAILURE|What went wrong|Caused by:|Could not resolve|BUILD" \
              ci/logs/forge-1.8.9.log | head -30 || true
          cp java/forge189/build/libs/*.jar artifacts/java-1.8.9/ 2>/dev/null || true
          ls -la artifacts/java-1.8.9
      - name: Verify
        if: always()
        run: |
          shopt -s nullglob
          jars=(artifacts/java-1.8.9/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "no jar produced" | tee artifacts/java-1.8.9/VERIFY.txt; exit 0
          fi
          python3 tools/verify_jar.py "${jars[@]}" \
            --json artifacts/java-1.8.9/verify.json | tee artifacts/java-1.8.9/VERIFY.txt
      - name: Commit
        if: always()
        run: bash tools/ci-commit.sh "ci: forge 1.8.9 jar $(date -u +%FT%TZ)" ci artifacts
