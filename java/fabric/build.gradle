// ZOROWARRIOR HORIZON BRIDGE — Fabric build for Minecraft 1.21.x.
//
// One project, one Minecraft version per invocation. Loom does the real work:
// it downloads Minecraft, applies Yarn names, compiles against real game
// classes and remaps the result to the intermediary names Fabric Loader
// expects at runtime. That remap is what makes the output a genuine mod rather
// than a renamed zip.
plugins {
    id 'fabric-loom' version '1.19.4'
    id 'java'
}

group = 'dev.zorowarrior'
version = project.mod_version

base {
    archivesName = "zoro_bridge-${project.mod_version}-fabric-${project.mc_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_target as int)
    }
}

repositories {
    mavenCentral()
    maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
}

// Which source variant to compile. 1.21.3 changed the block API in a way that
// makes one source impossible for all of 1.21.x, so the build picks a tree.
//   legacy = 1.21.1 and older: registry key optional, vanilla-only
//   modern = 1.21.3+: registry key required, registration must happen while the
//            registry is open, which needs Fabric API's RegistryEvent
def legacyVariant = (project.mc_version == '1.21.1')
def variantJava = legacyVariant ? '../shared/fabric-legacy/java' : '../shared/fabric/java'

dependencies {
    minecraft "com.mojang:minecraft:${project.mc_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    if (!legacyVariant) {
        // Only the modern variant needs it, and only for the registry hook.
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    }
}

// A headless dedicated-server run: it is the only way to prove the mod actually
// loads and that the registries accept the block and item, without a GPU.
loom {
    runs {
        server { server() }
        client { client() }
    }
}

sourceSets {
    main {
        // The mod's Java and its assets/data are shared with every other build,
        // so a fix applies everywhere — and the same files are what the Horizon
        // package is made from, which keeps the two outputs in step.
        java.srcDirs = ['src/main/java', variantJava]
        resources.srcDirs = ['src/main/resources', '../shared/assets', '../shared/data']
    }
}

// A typo in the shared paths above would otherwise produce a jar with no
// classes in it — which looks like success and is worthless. Fail loudly.
tasks.register('checkSources') {
    doLast {
        def dirs = sourceSets.main.java.srcDirs.findAll { it.isDirectory() }
        if (dirs.isEmpty()) {
            throw new GradleException("no Java source directory exists: " +
                    sourceSets.main.java.srcDirs)
        }
        def count = dirs.sum { d -> fileTree(d).matching { include '**/*.java' }.files.size() } as int
        if (count == 0) {
            throw new GradleException("no .java files under " + dirs)
        }
        logger.lifecycle("checkSources: ${count} java file(s) in ${dirs}")
    }
}
compileJava.dependsOn checkSources

processResources {
    inputs.property 'version', project.mod_version
    inputs.property 'minecraft', project.mc_version
    inputs.property 'loader', project.loader_version
    inputs.property 'java', project.java_target
    filesMatching('fabric.mod.json') {
        expand version: project.mod_version,
               minecraft: project.mc_version,
               loader: project.loader_version,
               java: project.java_target
    }
}

// A machine-readable record of exactly what was built, written next to the jar
// so the report can quote it without re-deriving anything.
tasks.register('buildFacts') {
    def out = layout.buildDirectory.file('bridge-build-facts.json')
    outputs.file(out)
    def facts = [
        schema     : 'zoro-horizon-bridge/java-build@1',
        loader     : 'fabric',
        source_variant: legacyVariant ? 'legacy (1.21.1 API)' : 'modern (1.21.3+ API)',
        fabric_api : legacyVariant ? null : project.fabric_api_version,
        mappings   : 'yarn',
        minecraft  : project.mc_version,
        yarn       : project.yarn_mappings,
        loader_ver : project.loader_version,
        java_target: project.java_target as int,
        jar        : "zoro_bridge-${project.mod_version}-fabric-${project.mc_version}.jar",
        gradle     : gradle.gradleVersion,
        loom       : '1.19.4'
    ]
    doLast {
        def file = out.get().asFile
        file.parentFile.mkdirs()
        file.text = groovy.json.JsonOutput.prettyPrint(
                groovy.json.JsonOutput.toJson(facts))
    }
}

build.dependsOn buildFacts
