// ZOROWARRIOR HORIZON BRIDGE — Minecraft 1.8.9, Forge.
//
// This build is deliberately old-fashioned because the target is old. Forge 1.8.9
// needs ForgeGradle 2.1, which predates Gradle 5 and only runs on a real JDK 8.
// (ForgeGradle 2.3 refuses the version outright: "does not support Minecraft
// 1.8.9. MIN: 1.12".) That is why this project has its own build file instead of
// sharing the modern one — the toolchains are not interchangeable.
buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://repo.maven.apache.org/maven2/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1.2'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = project.hasProperty('mod_version') ? project.mod_version : '1.0.0'
group = 'dev.zorowarrior'
archivesBaseName = "zoro_bridge-${version}-forge-1.8.9"

minecraft {
    version = '1.8.9-11.15.0.1677'
    runDir = 'run'
    // MCP names for 1.8.9.
    mappings = 'stable_22'
}

sourceCompatibility = targetCompatibility = '1.8'

processResources {
    inputs.property 'version', project.version
    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version
    }
}

jar {
    archiveName = "${archivesBaseName}.jar"
}
